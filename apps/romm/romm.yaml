apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: romm-resources
  namespace: romm
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: romm-assets
  namespace: romm
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: romm-redis
  namespace: romm
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: romm-library
  namespace: romm
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 200Gi    # local-path does not enforce this
---
apiVersion: v1
kind: Service
metadata:
  name: romm
  namespace: romm
spec:
  selector:
    app: romm
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: romm
  namespace: romm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: romm
  template:
    metadata:
      labels:
        app: romm
    spec:
      nodeSelector:
        kubernetes.io/hostname: dragglenet # This is what pins it to a node with real storage
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: romm
          image: rommapp/romm:5.4.1      # pin to a real release tag
          env:
            - name: DB_HOST
              value: romm-db
            - name: DB_NAME
              value: romm
            - name: DB_USER
              value: romm-user
            - name: DB_PASSWD
              valueFrom: {secretKeyRef: {name: romm-secrets, key: DB_PASSWD}}
            - name: ROMM_AUTH_SECRET_KEY
              valueFrom: {secretKeyRef: {name: romm-secrets, key: ROMM_AUTH_SECRET_KEY}}
            - name: ROMM_BASE_URL
              value: https://romm.draggle-labs.net
            - name: ROMM_SESSION_SECURE_COOKIE
              value: "true"
            - name: KIOSK_MODE
              value: "true"
            - name: ROM_CONVERTO_ENABLED
              value: "true"
            # Metadata Providers
            - name: HASHEOUS_API_ENABLED
              value: "true"
            - name: STEAM_API_ENABLED
              value: "true"
            - name: HLTB_API_ENABLED
              value: "true"
            - name: IGDB_CLIENT_ID
              value: um7czophifrz8vmn1lfqn0rqyb7zlt
            - name: IGDB_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: romm-secrets, key: IGDB_CLIENT_SECRET}}
            - name: STEAMGRIDDB_API_KEY
              valueFrom: {secretKeyRef: {name: romm-secrets, key: STEAMGRIDDB_API_KEY}}
            - name: RETROACHIEVEMENTS_API_KEY
              valueFrom: {secretKeyRef: {name: romm-secrets, key: RETROACHIEVEMENTS_API_KEY}}
            - name: SCREENSCRAPER_USER
              value: "Draggle"
            - name: SCREENSCRAPER_PASSWORD
              valueFrom: {secretKeyRef: {name: romm-secrets, key: SCREENSCRAPER_PASSWORD}}
          ports:
            - containerPort: 8080
          volumeMounts:
            - {name: library,   mountPath: /romm/library}
            - {name: resources, mountPath: /romm/resources}
            - {name: assets,    mountPath: /romm/assets}
            - {name: redis,     mountPath: /redis-data}
      volumes:
        - name: library
          persistentVolumeClaim: {claimName: romm-library}
        - name: resources
          persistentVolumeClaim: {claimName: romm-resources}
        - name: assets
          persistentVolumeClaim: {claimName: romm-assets}
        - name: redis
          persistentVolumeClaim: {claimName: romm-redis}