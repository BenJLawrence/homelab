apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  selector:
    app: jellyfin
  ports:
    - name: http
      port: 80
      targetPort: 8096
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: draggle-net-leader
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:12.4.0         # confirm the exact latest tag on Docker Hub
          ports:
            - containerPort: 8096
          env:
            - name: JELLYFIN_PublishedServerUrl
              value: https://tv.draggle-labs.net
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: all
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
          readinessProbe:
            httpGet: {path: /health, port: 8096}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8096}
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            limits: 
              nvidia.com/gpu: 1
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: cache,  mountPath: /cache}
            - {name: media,  mountPath: /media}
      volumes:
        - name: config
          persistentVolumeClaim: {claimName: jellyfin-config}
        - name: media
          persistentVolumeClaim: {claimName: jellyfin-media}
        - name: cache
          emptyDir:
            sizeLimit: 10Gi