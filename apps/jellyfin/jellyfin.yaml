apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  selector:
    app: jellyfin
  ports:
    - name: http
      port: 80
      targetPort: 8096
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: draggle-net-leader
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:12.4   # confirm the exact latest tag on Docker Hub
          ports:
            - containerPort: 8096
          env:
            - name: JELLYFIN_PublishedServerUrl
              value: https://tv.draggle-labs.net
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,video,utility
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: DOTNET_EnableCrashReport
              value: '1'
            - name: DOTNET_DbgEnableMiniDump
              value: '1'
            - name: DOTNET_DbgMiniDumpType
              value: '2'
          startupProbe:
            httpGet: {path: /health, port: 8096}
            periodSeconds: 11
            failureThreshold: 30        # up to 5 minutes to start
          readinessProbe:
            httpGet: {path: /health, port: 8096}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /health, port: 8096}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6         # about 3 minutes of failures before a restart
          resources:
            limits: 
              nvidia.com/gpu: 1
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: cache,  mountPath: /cache}
            - {name: media,  mountPath: /media}
      volumes:
        - name: config
          persistentVolumeClaim: {claimName: jellyfin-config}
          # emptyDir:
          #   sizeLimit: 10Gi
        - name: media
          persistentVolumeClaim: {claimName: jellyfin-media}
          # hostPath:
          #   path: /srv/media
          #   type: Directory
        - name: cache
          emptyDir:
            sizeLimit: 10Gi