apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  namespace: jellyfin
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi      # metadata and artwork grow with library size
