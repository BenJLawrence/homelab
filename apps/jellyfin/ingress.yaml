apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin
  namespace: jellyfin
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-stage
spec:
  ingressClassName: traefik
  rules:
    - host: tv.draggle-labs.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin
                port:
                  number: 80
  tls:
    - hosts: [tv.draggle-labs.net]
      secretName: jellyfin-draggle-labs-net-tls