apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb-controller
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/metallb/controller
  prune: true
  wait: true            # wait for the HelmRelease to be healthy
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb-config
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: metallb-controller
  path: ./infrastructure/metallb/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system