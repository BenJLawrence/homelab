apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-device-plugin
  namespace: nvidia-device-plugin
spec:
  interval: 1h
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
  chart:
    spec:
      chart: nvidia-device-plugin
      version: "0.19.2"        # latest I found was v0.19.x; confirm below
      sourceRef:
        kind: HelmRepository
        name: nvdp
  values:
    runtimeClassName: nvidia   # k3s doesn't make nvidia the default runtime
    nodeSelector:
      kubernetes.io/hostname: draggle-net-leader
    affinity: null             # drop the chart's default node-label affinity
    nfd:
      enabled: false           # no Node Feature Discovery needed with the nodeSelector
    gfd:
      enabled: false