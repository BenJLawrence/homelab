apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    speaker:
      frr:
        enabled: false
  chart:
    spec:
      chart: metallb
      version: "0.16.2"   # pin to a specific version you've checked
      sourceRef:
        kind: HelmRepository
        name: metallb