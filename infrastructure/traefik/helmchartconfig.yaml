apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      annotations:
        metallb.io/loadBalancerIPs: 192.168.1.80
    ports:
      web:
        hostPort: 80
      websecure:
        hostPort: 443
    nodeSelector:
      kubernetes.io/hostname: draggle-net-leader