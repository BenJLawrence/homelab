apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.1"    # chart versions keep the "v" prefix; confirm it's still the latest
      sourceRef:
        kind: HelmRepository
        name: jetstack
  values:
    crds:
      enabled: true
      keep: true            # don't delete CRDs (and your certs) if the chart is uninstalled